<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Александра & Илья | Наша свадьба</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Raleway&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Герой-секция -->
    <section class="hero">
        <h1>Александра & Илья</h1>
        <p class="date">16 Мая 2026</p>
        <div class="countdown" id="countdown"></div>
    </section>

    <!-- О свадьбе -->
    <section class="details">
        <h2>Мы женимся!</h2>
        <div class="info-grid">
            <div class="info-item">
                <h3>⏰ Когда</h3>
                <p>16 Мая 2026</p>
                <p>Церемония: 15:00</p>
                <p>Банкет: 17:00</p>
            </div>
            <div class="info-item">
                <h3>📍 Где</h3>
                <p>Ресторан "Беседка"</p>
                <p>Москва, Парк Горького</p>
                <a href="https://maps.google.com/?q=Москва,ПаркГорького" target="_blank">Открыть карту</a>
            </div>
        </div>
    </section>

    <!-- RSVP форма через Google Forms -->
    <section class="rsvp">
        <h2>Подтвердите участие</h2>
        <p>Пожалуйста, ответьте до 1 апреля</p>
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe9Vydb2inVlVrpHryqe8Xa_uI5aY8f3MKO8gdCUyHZwl2taA/viewform?embedded=true" 
                width="100%" height="800" frameborder="0" marginheight="0" marginwidth="0">
            Загрузка...
        </iframe>
    </section>

    <!-- Галерея -->
    <section class="gallery">
        <h2>Наша история</h2>
        <div class="photos">
            <img src="images/photo1.jpg" alt="Наше первое фото">
            <img src="images/photo2.jpg" alt="Отпуск в горах">
            <img src="images/photo3.jpg" alt="Предложение">
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
